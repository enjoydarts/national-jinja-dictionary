name: Verify code, canonical data and offline release generation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - run: python -m unittest discover -s tests -v
      - run: python -m njd validate
      - name: Verify release assets can be rebuilt without crawling
        run: python -m njd.release --version "ci-${GITHUB_SHA}" --source-commit "$GITHUB_SHA"
