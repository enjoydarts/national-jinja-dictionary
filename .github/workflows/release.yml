name: Generate dictionaries and publish release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose canonical data will be packaged
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Verify implementation and canonical data
        run: |
          python -m unittest discover -s tests -v
          python -m njd validate
      - name: Regenerate every supported dictionary from this tag's canonical data
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          python -m njd.release --version "$RELEASE_TAG" --source-commit "$SOURCE_COMMIT" --expected-tag "$RELEASE_TAG"
      - name: Attach freshly generated assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS dist/dictionaries/SOURCE.json --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS dist/dictionaries/SOURCE.json \
              --verify-tag --title "全国神社辞書 $RELEASE_TAG" --notes-file dist/RELEASE_NOTES.md
          fi
