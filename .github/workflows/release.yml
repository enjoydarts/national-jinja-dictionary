name: Generate dictionaries and publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (0.2.0 or v0.2.0; tag will be v0.2.0)
        required: true
        type: string
      dry_run:
        description: Generate and verify artifacts without creating a tag or publishing
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Verify implementation and canonical data
        run: |
          python -m unittest discover -s tests -v
          python -m njd validate
      - name: Generate changelog and dictionaries, then tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--version "$RELEASE_VERSION")
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          python -m njd.publishing "${args[@]}"
      - name: Save generated release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ inputs.version }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.zip
            dist/SHA256SUMS
            dist/SOURCE.json
            dist/CHANGELOG.md
