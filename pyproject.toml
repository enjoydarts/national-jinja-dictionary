[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "national-jinja-dictionary"
version = "0.2.0"
description = "Source-grounded Japanese shrine dictionaries for multiple input methods"
readme = "README.md"
requires-python = ">=3.15.2"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "enjoydarts"}]
dependencies = []

[project.scripts]
national-jinja-dictionary = "njd.__main__:main"

[tool.setuptools.packages.find]
include = ["njd*"]
